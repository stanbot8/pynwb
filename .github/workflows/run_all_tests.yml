name: Run all tests
on:
  schedule:
  - cron: 0 5 * * *      # once per day at midnight ET
  push:
    tags:  # run only on new tags that follow semver MAJOR.MINOR.PATCH
    - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' && 
    'refs/heads/dev' || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && (true) }}

jobs:
  run-all-tests:
    # the only differences between this job and "run_tests.yml" is the "strategy.matrix.include" and the upload
    # distributions step.
    # GitHub Actions does not yet support YAML anchors, easily reusable components, or easy dynamic matrix
    # configurations based on the github event, so this job is duplicated for the most part
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - {name: linux-python3.10-minimum, test-tox-env: test-py310-minimum, 
            python-ver: '3.10', os: ubuntu-latest}
        - {name: linux-python3.11, test-tox-env: test-py311-upgraded, python-ver: '3.11',
          os: ubuntu-latest}
        - {name: linux-python3.12, test-tox-env: test-py312-upgraded, python-ver: '3.12',
          os: ubuntu-latest}
        - {name: linux-python3.13, test-tox-env: test-py313-upgraded, python-ver: '3.13',
          os: ubuntu-latest}
        - {name: linux-python3.13-opt, test-tox-env: 
            test-py313-upgraded-optional, python-ver: '3.13', os: ubuntu-latest}
        - {name: linux-python3.14, test-tox-env: test-py314-upgraded, python-ver: '3.14',
          os: ubuntu-latest}
        - {name: linux-python3.14-prerelease, test-tox-env: 
            test-py314-prerelease, python-ver: '3.14', os: ubuntu-latest}
        - {name: windows-python3.10-minimum, test-tox-env: test-py310-minimum, 
            python-ver: '3.10', os: windows-latest}
        - {name: windows-python3.11, test-tox-env: test-py311-upgraded, 
            python-ver: '3.11', os: windows-latest}
        - {name: windows-python3.12, test-tox-env: test-py312-upgraded, 
            python-ver: '3.12', os: windows-latest}
        - {name: windows-python3.13, test-tox-env: test-py313-upgraded, 
            python-ver: '3.13', os: windows-latest}
        - {name: windows-python3.13-opt, test-tox-env: 
            test-py313-upgraded-optional, python-ver: '3.13', os: windows-latest}
        - {name: windows-python3.14, test-tox-env: test-py314-upgraded, 
            python-ver: '3.14', os: windows-latest}
        - {name: windows-python3.14-prerelease, test-tox-env: 
            test-py314-prerelease, python-ver: '3.14', os: windows-latest}
        - {name: macos-python3.10-minimum, test-tox-env: test-py310-minimum, 
            python-ver: '3.10', os: macos-15-intel}
        - {name: macos-python3.11, test-tox-env: test-py311-upgraded, python-ver: '3.11',
          os: macos-latest}
        - {name: macos-python3.12, test-tox-env: test-py312-upgraded, python-ver: '3.12',
          os: macos-latest}
        - {name: macos-python3.13, test-tox-env: test-py313-upgraded, python-ver: '3.13',
          os: macos-latest}
        - {name: macos-python3.13-opt, test-tox-env: 
            test-py313-upgraded-optional, python-ver: '3.13', os: macos-latest}
        - {name: macos-python3.14, test-tox-env: test-py314-upgraded, python-ver: '3.14',
          os: macos-latest}
        - {name: macos-python3.14-prerelease, test-tox-env: 
            test-py314-prerelease, python-ver: '3.14', os: macos-latest}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0    # tags are required for versioneer to determine the version

        ref: ${{ github.event_name == 'schedule' && 
          'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || github.sha }}
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-ver }}

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
        python -m pip list

    - name: Run tox tests
      run: |
        tox -e ${{ matrix.test-tox-env }}

    - name: Build wheel and source distribution
      run: |
        tox -e build
        ls -1 dist

    - name: Check distribution metadata
        # twine is pinned to the version bundled in pypa/gh-action-pypi-publish so that this check
        # and the upload in deploy_release.yml apply the same metadata validation.
      run: |
        python -m pip install twine==7.0.0
        python -m twine check --strict dist/*

    - name: Test installation from a wheel
      run: |
        tox -e wheelinstall --recreate --installpkg dist/*-none-any.whl

    env:
      ALPHA_BRIDGE_SOURCE_SHA: ${{ github.event_name == 'schedule' && 
        'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || github.sha }}
      ALPHA_BRIDGE_SOURCE_REF: ${{ github.event_name == 'schedule' && 
        'refs/heads/dev' || github.ref }}
      ALPHA_BRIDGE_SOURCE_REF_NAME: ${{ github.event_name == 'schedule' && 'dev'
        || github.ref_name }}
    needs:
    - alpha_bridge_inputs
    if: ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' 
      }}
  run-all-gallery-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - {name: linux-gallery-python3.10-minimum, test-tox-env: 
            gallery-py310-minimum, python-ver: '3.10', os: ubuntu-latest}
        - {name: linux-gallery-python3.14-upgraded, test-tox-env: 
            gallery-py314-upgraded, python-ver: '3.14', os: ubuntu-latest}
        - {name: linux-gallery-python3.14-prerelease, test-tox-env: 
            gallery-py314-prerelease, python-ver: '3.14', os: ubuntu-latest}
        - {name: windows-gallery-python3.10-minimum, test-tox-env: 
            gallery-py310-minimum, python-ver: '3.10', os: windows-latest}
        - {name: windows-gallery-python3.14-upgraded, test-tox-env: 
            gallery-py314-upgraded, python-ver: '3.14', os: windows-latest}
        - {name: windows-gallery-python3.14-prerelease, test-tox-env: 
            gallery-py314-prerelease, python-ver: '3.14', os: windows-latest}
        - {name: macos-gallery-python3.10-minimum, test-tox-env: 
            gallery-py310-minimum, python-ver: '3.10', os: macos-15-intel}
        - {name: macos-gallery-python3.13-upgraded, test-tox-env: 
            gallery-py313-upgraded, python-ver: '3.13', os: macos-latest}
        - {name: macos-gallery-python3.13-prerelease, test-tox-env: 
            gallery-py313-prerelease, python-ver: '3.13', os: macos-latest}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0    # tags are required for versioneer to determine the version

        ref: ${{ github.event_name == 'schedule' && 
          'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || github.sha }}
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-ver }}

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
        python -m pip list

    - name: Run tox tests
      run: |
        tox -e ${{ matrix.test-tox-env }}

    env:
      ALPHA_BRIDGE_SOURCE_SHA: ${{ github.event_name == 'schedule' && 
        'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || github.sha }}
      ALPHA_BRIDGE_SOURCE_REF: ${{ github.event_name == 'schedule' && 
        'refs/heads/dev' || github.ref }}
      ALPHA_BRIDGE_SOURCE_REF_NAME: ${{ github.event_name == 'schedule' && 'dev'
        || github.ref_name }}
    needs:
    - alpha_bridge_inputs
    if: ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' 
      }}
  run-all-tests-on-conda:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0} # needed for conda environment to work
    strategy:
      fail-fast: false
      matrix:
        include:
        - {name: conda-linux-python3.10-minimum, test-tox-env: 
            test-py310-minimum, python-ver: '3.10', os: ubuntu-latest}
        - {name: conda-linux-python3.11, test-tox-env: test-py311-upgraded, 
            python-ver: '3.11', os: ubuntu-latest}
        - {name: conda-linux-python3.12, test-tox-env: test-py312-upgraded, 
            python-ver: '3.12', os: ubuntu-latest}
        - {name: conda-linux-python3.13, test-tox-env: test-py313-upgraded, 
            python-ver: '3.13', os: ubuntu-latest}
        - {name: conda-linux-python3.14, test-tox-env: test-py314-upgraded, 
            python-ver: '3.14', os: ubuntu-latest}
        - {name: conda-linux-python3.14-prerelease, test-tox-env: 
            test-py314-prerelease, python-ver: '3.14', os: ubuntu-latest}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0    # tags are required for versioneer to determine the version

        ref: ${{ github.event_name == 'schedule' && 
          'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || github.sha }}
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v4
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-ver }}

    - name: Install build dependencies
      run: |
        conda config --set always_yes yes --set changeps1 no
        conda info
        conda install -c conda-forge "tox>=4.0"

    - name: Conda reporting
      run: |
        conda info
        conda config --show-sources
        conda list --show-channel-urls

    - name: Run tox tests
      run: |
        tox -e ${{ matrix.test-tox-env }}

    - name: Build wheel and source distribution
      run: |
        tox -e build
        ls -1 dist

    - name: Check distribution metadata
        # twine is pinned to the version bundled in pypa/gh-action-pypi-publish so that this check
        # and the upload in deploy_release.yml apply the same metadata validation.
      run: |
        python -m pip install twine==7.0.0
        python -m twine check --strict dist/*

    - name: Test installation from a wheel
      run: |
        tox -e wheelinstall --recreate --installpkg dist/*-none-any.whl


    env:
      ALPHA_BRIDGE_SOURCE_SHA: ${{ github.event_name == 'schedule' && 
        'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || github.sha }}
      ALPHA_BRIDGE_SOURCE_REF: ${{ github.event_name == 'schedule' && 
        'refs/heads/dev' || github.ref }}
      ALPHA_BRIDGE_SOURCE_REF_NAME: ${{ github.event_name == 'schedule' && 'dev'
        || github.ref_name }}
    needs:
    - alpha_bridge_inputs
    if: ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' 
      }}
  run-ros3-tests:  # tox and conda do not play nicely so do not use tox here
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # backstop against the HDF5 ros3 shutdown deadlock on Windows
    defaults:
      run:
        shell: bash -l {0}  # necessary for conda
    strategy:
      fail-fast: false
      matrix:
        include:
        - {name: conda-linux-python3.14-ros3, python-ver: '3.14', os: 
            ubuntu-latest}
        - {name: conda-windows-python3.14-ros3, python-ver: '3.14', os: 
            windows-latest}
        - {name: conda-macos-python3.14-ros3, python-ver: '3.14', os: 
            macos-latest}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0    # tags are required for versioneer to determine the version

        ref: ${{ github.event_name == 'schedule' && 
          'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || github.sha }}
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v4
      with:
        auto-update-conda: true
        activate-environment: ros3
        environment-file: environment-ros3.yml
        python-version: ${{ matrix.python-ver }}
        channels: conda-forge
        conda-remove-defaults: 'true'
        auto-activate: false

    - name: Install run dependencies
      run: |
        pip install --group test .
        conda info
        conda list
        pip list

    - name: Run ros3 tests
      run: |
        python scripts/test_ros3.py --ros3

    env:
      ALPHA_BRIDGE_SOURCE_SHA: ${{ github.event_name == 'schedule' && 
        'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || github.sha }}
      ALPHA_BRIDGE_SOURCE_REF: ${{ github.event_name == 'schedule' && 
        'refs/heads/dev' || github.ref }}
      ALPHA_BRIDGE_SOURCE_REF_NAME: ${{ github.event_name == 'schedule' && 'dev'
        || github.ref_name }}
    needs:
    - alpha_bridge_inputs
    if: ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' 
      }}
  run-gallery-ros3-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # backstop against the HDF5 ros3 shutdown deadlock on Windows
    defaults:
      run:
        shell: bash -l {0}  # necessary for conda
    strategy:
      fail-fast: false
      matrix:
        include:
        - {name: conda-linux-gallery-python3.14-ros3, python-ver: '3.14', os: 
            ubuntu-latest}
        - {name: conda-windows-gallery-python3.14-ros3, python-ver: '3.14', os: 
            windows-latest}
        - {name: conda-macos-gallery-python3.14-ros3, python-ver: '3.14', os: 
            macos-latest}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0    # tags are required for versioneer to determine the version

        ref: ${{ github.event_name == 'schedule' && 
          'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || github.sha }}
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v4
      with:
        auto-update-conda: true
        activate-environment: ros3
        environment-file: environment-ros3.yml
        python-version: ${{ matrix.python-ver }}
        channels: conda-forge
        conda-remove-defaults: 'true'
        auto-activate: false

    - name: Install run dependencies
      run: |
        pip install --group docs ".[zarr,termset]"
        pip list

    - name: Conda reporting
      run: |
        conda info
        conda config --show-sources
        conda list --show-channel-urls

    - name: Run gallery ros3 tests
      run: |
        python scripts/test_ros3.py --example-ros3

  # the streaming HERD gallery example is excluded from the offline example
  # tests (it streams from the DANDI Archive), so run it once here
    env:
      ALPHA_BRIDGE_SOURCE_SHA: ${{ github.event_name == 'schedule' && 
        'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || github.sha }}
      ALPHA_BRIDGE_SOURCE_REF: ${{ github.event_name == 'schedule' && 
        'refs/heads/dev' || github.ref }}
      ALPHA_BRIDGE_SOURCE_REF_NAME: ${{ github.event_name == 'schedule' && 'dev'
        || github.ref_name }}
    needs:
    - alpha_bridge_inputs
    if: ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' 
      }}
  run-streaming-example:
    name: linux-streaming-example-python3.14
    runs-on: ubuntu-latest
    timeout-minutes: 15  # backstop against a stalled or throttled stream from the DANDI Archive
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0    # tags are required for versioneer to determine the version

        ref: ${{ github.event_name == 'schedule' && 
          'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || github.sha }}
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install run dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install dandi fsspec tqdm aiohttp requests .
        python -m pip list

    - name: Run the DANDI streaming HERD example
      run: |
        python docs/gallery/general/resources_streaming.py
    env:
      ALPHA_BRIDGE_SOURCE_SHA: ${{ github.event_name == 'schedule' && 
        'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || github.sha }}
      ALPHA_BRIDGE_SOURCE_REF: ${{ github.event_name == 'schedule' && 
        'refs/heads/dev' || github.ref }}
      ALPHA_BRIDGE_SOURCE_REF_NAME: ${{ github.event_name == 'schedule' && 'dev'
        || github.ref_name }}
    needs:
    - alpha_bridge_inputs
    if: ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' 
      }}
  alpha_bridge_inputs:
    name: AlphaBridge input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
    - id: identity
      name: Check source, workflow, variables, and runner inputs
      env:
        GH_TOKEN: ${{ github.token }}
        AB_REPOSITORY: ${{ github.repository }}
        AB_RUN_ID: ${{ github.run_id }}
        AB_HEAD_SHA: ef74c1660ac4ae6980a86ffbb665fc24e8c2d197
        AB_WORKFLOW_DIGEST: 
          e7ee19041c9191e38864bc814472bbb838a1b5fd24ce392c2ced4eb3a4fa121e
        AB_EVENT: ${{ github.event_name }}
        AB_SCHEDULE: ${{ github.event.schedule || '' }}
        AB_VARIABLES: ${{ toJSON(vars) }}
        AB_INPUTS: ${{ toJSON(inputs) }}
      shell: bash
      run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native scheduled-CI input check,
        embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
        annotations\n\nimport hashlib\nimport json\nimport os\nimport urllib.parse\n\
        import urllib.request\n\n\ndef changed(get, *, repository, run_id, identity,
        job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
        )\n    event = current[\"event\"]\n    query = urllib.parse.urlencode(\n \
        \       {\n            \"branch\": current[\"head_branch\"],\n           \
        \ \"event\": event,\n            \"per_page\": 100,\n        }\n    )\n  \
        \  runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
        )\n    for run in runs[\"workflow_runs\"]:\n        if run[\"id\"] == run_id:\n\
        \            continue\n        if run.get(\"head_branch\") != current[\"head_branch\"\
        ] or run.get(\"event\") != event:\n            raise ValueError(\"provider
        returned a different CI input identity\")\n        page = 1\n        while
        True:\n            jobs = get(\n                f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={page}\"\
        \n            )[\"jobs\"]\n            for job in jobs:\n                if
        (\n                    job[\"name\"] == job_name\n                    and
        job.get(\"status\") == \"completed\"\n                    and job.get(\"conclusion\"\
        ) == \"success\"\n                    and any(\n                        step[\"\
        name\"] == f\"AlphaBridge input identity {identity}\"\n                  \
        \      and step.get(\"conclusion\") == \"success\"\n                     \
        \   for step in job.get(\"steps\", [])\n                    )\n          \
        \      ):\n                    return False\n            if len(jobs) < 100:\n\
        \                break\n            page += 1\n    return True\n\n\ndef main():\n\
        \    inputs = {\n        \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n\
        \        \"workflow_definition\": os.environ[\"AB_WORKFLOW_DIGEST\"],\n  \
        \      \"event\": os.environ[\"AB_EVENT\"],\n        \"schedule\": os.environ[\"\
        AB_SCHEDULE\"],\n        \"variables\": json.loads(os.environ[\"AB_VARIABLES\"\
        ]),\n        \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n        \"\
        runner_image\": [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"ImageVersion\"\
        , \"\")],\n    }\n    identity = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()\n\
        \n    def get(path):\n        request = urllib.request.Request(\n        \
        \    \"https://api.github.com\" + path,\n            headers={\n         \
        \       \"Authorization\": \"Bearer \" + os.environ[\"GH_TOKEN\"],\n     \
        \           \"Accept\": \"application/vnd.github+json\",\n               \
        \ \"X-GitHub-Api-Version\": \"2026-03-10\",\n            },\n        )\n \
        \       with urllib.request.urlopen(request, timeout=60) as response:\n  \
        \          return json.load(response)\n\n    should_run = inputs[\"event\"\
        ] != \"schedule\" or changed(\n        get,\n        repository=os.environ[\"\
        AB_REPOSITORY\"],\n        run_id=int(os.environ[\"AB_RUN_ID\"]),\n      \
        \  identity=identity,\n        job_name=\"AlphaBridge input check\",\n   \
        \ )\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\"\
        ) as output:\n        output.write(f\"digest={identity}\\nchanged={str(should_run).lower()}\\\
        n\")\n    print(\"CI inputs changed\" if should_run else \"CI inputs unchanged;
        build and test jobs skipped\")\n\n\nif __name__ == \"__main__\":\n    main()\n\
        \nALPHA_BRIDGE_CI_PY\n"
    - name: AlphaBridge input identity ${{ steps.identity.outputs.digest }}
      run: echo 'Input identity recorded'
