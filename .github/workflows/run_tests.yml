name: Run tests
on:
  push:
    branches:
      - dev
    tags-ignore:  # exclude the rolling tag that the deploy-dev job moves to each dev commit
      - 'latest'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ ((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/dev' || github.ref) }}
  cancel-in-progress: ${{ (github.event_name == 'workflow_dispatch' || 
    github.run_attempt > 1) && (true) }}

jobs:
  run-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-python3.10-minimum, test-tox-env: test-py310-minimum, 
              python-ver: "3.10", os: ubuntu-latest}
          # NOTE config below with "upload-wheels: true" specifies that wheels should be uploaded as an artifact
          - {name: linux-python3.14-upgraded, test-tox-env: test-py314-upgraded, 
              python-ver: "3.14", os: ubuntu-latest, upload-wheels: true}
          - {name: windows-python3.10-minimum, test-tox-env: test-py310-minimum, 
              python-ver: "3.10", os: windows-latest}
          - {name: windows-python3.14-upgraded, test-tox-env: 
              test-py314-upgraded, python-ver: "3.14", os: windows-latest}
          - {name: macos-python3.10-minimum, test-tox-env: test-py310-minimum, 
              python-ver: "3.10", os: macos-15-intel}
          - {name: macos-python3.14-upgraded, test-tox-env: test-py314-upgraded, 
              python-ver: "3.14", os: macos-latest}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0  # tags are required for versioneer to determine the version

          ref: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && 'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || 
            github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-ver }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox
          python -m pip list

      - name: Run tox tests
        run: |
          tox -e ${{ matrix.test-tox-env }}

      - name: Build wheel and source distribution
        run: |
          tox -e build
          ls -1 dist

      - name: Check distribution metadata
        # twine is pinned to the version bundled in pypa/gh-action-pypi-publish so that this check
        # and the upload in deploy_release.yml apply the same metadata validation.
        run: |
          python -m pip install twine==7.0.0
          python -m twine check --strict dist/*

      - name: Test installation from a wheel
        run: |
          tox -e wheelinstall --recreate --installpkg dist/*-none-any.whl

      - name: Upload distribution as a workspace artifact
        if: ${{ matrix.upload-wheels }}
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist

    needs:
      - alpha_bridge_inputs
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  run-gallery-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-gallery-python3.10-minimum, test-tox-env: 
              gallery-py310-minimum, python-ver: "3.10", os: ubuntu-latest}
          - {name: linux-gallery-python3.14-upgraded, test-tox-env: 
              gallery-py314-upgraded, python-ver: "3.14", os: ubuntu-latest}
          - {name: windows-gallery-python3.10-minimum, test-tox-env: 
              gallery-py310-minimum, python-ver: "3.10", os: windows-latest}
          - {name: windows-gallery-python3.14-upgraded, test-tox-env: 
              gallery-py314-upgraded, python-ver: "3.14", os: windows-latest}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0  # tags are required for versioneer to determine the version

          ref: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && 'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || 
            github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-ver }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox
          python -m pip list

      - name: Run tox tests
        run: |
          tox -e ${{ matrix.test-tox-env }}

    needs:
      - alpha_bridge_inputs
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  run-tests-on-conda:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0} # necessary for conda
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: conda-linux-python3.10-minimum, test-tox-env: 
              test-py310-minimum, python-ver: "3.10", os: ubuntu-latest}
          - {name: conda-linux-python3.14-upgraded, test-tox-env: 
              test-py314-upgraded, python-ver: "3.14", os: ubuntu-latest}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0  # tags are required for versioneer to determine the version

          ref: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && 'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || 
            github.sha }}
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-ver }}

      - name: Install build dependencies
        run: |
          conda config --set always_yes yes --set changeps1 no
          conda info
          conda install -c conda-forge tox

      - name: Conda reporting
        run: |
          conda info
          conda config --show-sources
          conda list --show-channel-urls

      - name: Run tox tests
        run: |
          tox -e ${{ matrix.test-tox-env }}

      - name: Build wheel and source distribution
        run: |
          tox -e build
          ls -1 dist

      - name: Check distribution metadata
        # twine is pinned to the version bundled in pypa/gh-action-pypi-publish so that this check
        # and the upload in deploy_release.yml apply the same metadata validation.
        run: |
          python -m pip install twine==7.0.0
          python -m twine check --strict dist/*

      - name: Test installation from a wheel
        run: |
          tox -e wheelinstall --recreate --installpkg dist/*-none-any.whl

    needs:
      - alpha_bridge_inputs
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  run-ros3-tests:  # tox and conda do not play nicely so do not use tox here
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}  # necessary for conda
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: conda-linux-python3.14-ros3, python-ver: "3.14", os: 
              ubuntu-latest}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0  # tags are required for versioneer to determine the version

          ref: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && 'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || 
            github.sha }}
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          activate-environment: ros3
          environment-file: environment-ros3.yml
          python-version: ${{ matrix.python-ver }}
          channels: conda-forge
          conda-remove-defaults: "true"
          auto-activate: false

      - name: Install run dependencies
        run: |
          pip install --group test .
          conda info
          conda list
          pip list

      - name: Run ros3 tests
        run: |
          python scripts/test_ros3.py --ros3

    needs:
      - alpha_bridge_inputs
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  run-gallery-ros3-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}  # necessary for conda
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: conda-linux-gallery-python3.14-ros3, python-ver: "3.14", os: 
              ubuntu-latest}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0  # tags are required for versioneer to determine the version

          ref: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && 'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || 
            github.sha }}
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          activate-environment: ros3
          environment-file: environment-ros3.yml
          python-version: ${{ matrix.python-ver }}
          channels: conda-forge
          conda-remove-defaults: "true"
          auto-activate: false

      - name: Install run dependencies
        run: |
          pip install --group docs ".[zarr,termset]"
          pip list

      - name: Conda reporting
        run: |
          conda info
          conda config --show-sources
          conda list --show-channel-urls

      - name: Run gallery ros3 tests
        run: |
          python scripts/test_ros3.py --example-ros3

    needs:
      - alpha_bridge_inputs
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  deploy-dev:
    name: Deploy pre-release from dev
    needs:
      - run-tests
      - run-gallery-tests
      - run-tests-on-conda
      - run-ros3-tests
      - run-gallery-ros3-tests
      - alpha_bridge_inputs
    if: |-
      ${{ (github.event_name == 'push') && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the "latest" pre-release and move its tag
    steps:
      - name: Download wheel and source distributions from artifact
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist

      - name: Publish wheel and source distributions as a GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_BRIDGE_SOURCE_SHA: ${{ (github.event_name == 'schedule' || 
            github.event_name == 'workflow_run') && 
            'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || github.sha }}
          ALPHA_BRIDGE_SOURCE_REF: ${{ (github.event_name == 'schedule' || 
            github.event_name == 'workflow_run') && 'refs/heads/dev' || 
            github.ref }}
          ALPHA_BRIDGE_SOURCE_REF_NAME: ${{ (github.event_name == 'schedule' || 
            github.event_name == 'workflow_run') && 'dev' || github.ref_name }}
        run: |
          ls -1 dist
          # The "latest" pre-release is a rolling pointer to the tip of dev, holding only the
          # distributions built from that commit. Delete the release and the tag separately, then
          # recreate both, so that the tag, the target commit, and the attached artifacts stay
          # consistent.
          if gh release view latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete latest --repo "$GITHUB_REPOSITORY" --yes
          fi
          # Delete the tag on its own so the step tolerates a release and tag that are out of sync,
          # such as a release whose tag was already removed or a tag left behind without a release.
          gh api --silent -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" 2> /dev/null || true

          gh release create latest dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$ALPHA_BRIDGE_SOURCE_SHA" \
            --title "Latest" \
            --prerelease \
            --notes "Pre-release build of the dev branch at commit $ALPHA_BRIDGE_SOURCE_SHA."
  alpha_bridge_inputs:
    name: CI input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
      - id: identity
        name: Check source, workflow, variables, and runner inputs
        env:
          GH_TOKEN: ${{ github.token }}
          AB_REPOSITORY: ${{ github.repository }}
          AB_RUN_ID: ${{ github.run_id }}
          AB_HEAD_SHA: ${{ (github.event_name == 'schedule' || github.event_name
            == 'workflow_run') && 'ef74c1660ac4ae6980a86ffbb665fc24e8c2d197' || 
            github.sha }}
          AB_REF: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && 'refs/heads/dev' || github.ref }}
          AB_WORKFLOW_DIGEST: 
            7adbcc9efb206f888e8c4b40518e0ee3afcb4f46e3fe8d7387eb119da2f94994
          AB_EVENT: ${{ github.event_name }}
          AB_SCHEDULE: ${{ github.event.schedule || '' }}
          AB_VARIABLES: ${{ toJSON(vars) }}
          AB_INPUTS: ${{ toJSON(inputs) }}
          AB_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
        shell: bash
        run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native automatic-CI input check,
          embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
          annotations\n\nimport base64\nimport hashlib\nimport json\nimport os\nimport
          re\nimport urllib.parse\nimport urllib.request\n\nINPUT_CHECK_NAMES = (\"\
          CI input check\", \"AlphaBridge input check\")\nINPUT_IDENTITY_PREFIXES
          = (\"CI input identity \", \"AlphaBridge input identity \")\n\n\ndef is_input_check(job):\n\
          \    \"\"\"GitHub prefixes callable job names with each caller's display
          name.\"\"\"\n    return job.get(\"name\", \"\").rsplit(\" / \", 1)[-1] in
          INPUT_CHECK_NAMES\n\n\ndef input_identity(job):\n    for step in job.get(\"\
          steps\", []):\n        if step.get(\"conclusion\") != \"success\":\n   \
          \         continue\n        name = step.get(\"name\", \"\")\n        for
          prefix in INPUT_IDENTITY_PREFIXES:\n            if name.startswith(prefix):\n\
          \                identity = name.removeprefix(prefix)\n                if
          re.fullmatch(r\"[0-9a-f]{64}\", identity):\n                    return identity\n\
          \    return \"\"\n\n\ndef parent_has_work(get, repository, parent):\n  \
          \  if (\n        not parent\n        or parent.get(\"head_branch\") != \"\
          alpha-bridge-ci\"\n        or parent.get(\"status\") != \"completed\"\n\
          \    ):\n        return True\n    sha = parent[\"head_sha\"]\n    if re.fullmatch(r\"\
          [0-9a-f]{40}\", sha) is None:\n        raise ValueError(\"parent workflow
          has no exact configuration commit\")\n    record = get(f\"/repos/{repository}\"\
          )\n    marker_file = get(f\"/repos/{repository}/contents/.github/alpha-bridge-ci.json?ref={sha}\"\
          )\n    marker = json.loads(base64.b64decode(marker_file[\"content\"]))\n\
          \    if (\n        record.get(\"fork\") is not True\n        or marker.get(\"\
          schema\") != \"alpha-bridge/fork-ci\"\n        or marker.get(\"source_repository\"\
          ) != record.get(\"parent\", {}).get(\"full_name\")\n    ):\n        raise
          ValueError(\"parent CI configuration has no verified fork ownership\")\n\
          \    path = parent[\"path\"].split(\"@\", 1)[0]\n    if not path.startswith(\"\
          .github/workflows/\") or \"/\" in path.removeprefix(\".github/workflows/\"\
          ):\n        raise ValueError(\"parent workflow path is outside its configuration
          owner\")\n    definition = get(f\"/repos/{repository}/contents/{urllib.parse.quote(path,
          safe='/')}?ref={sha}\")\n    if hashlib.sha256(base64.b64decode(definition[\"\
          content\"])).hexdigest() != marker.get(\n        \"definition_sha256\",
          {}\n    ).get(path):\n        raise ValueError(\"parent workflow differs
          from its owned definition\")\n    if path == \".github/workflows/alpha-bridge-ci-verify.yml\"\
          :\n        return False\n    jobs = []\n    page = 1\n    while True:\n\
          \        values = get(\n            f\"/repos/{repository}/actions/runs/{parent['id']}/jobs?per_page=100&page={page}\"\
          \n        )[\"jobs\"]\n        jobs.extend(values)\n        if len(values)
          < 100:\n            break\n        page += 1\n    guards = [\n        job\n\
          \        for job in jobs\n        if is_input_check(job) and job.get(\"\
          conclusion\") == \"success\" and input_identity(job)\n    ]\n    return
          not guards or any(\n        job not in guards and job.get(\"conclusion\"\
          ) != \"skipped\" for job in jobs\n    )\n\n\ndef changed(get, *, repository,
          run_id, identity, job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
          )\n    event = current[\"event\"]\n    page = 1\n    while True:\n     \
          \   # Filter locally: GitHub caps filtered searches at 1,000 results.\n\
          \        query = urllib.parse.urlencode({\"per_page\": 100, \"page\": page})\n\
          \        runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
          )\n        for run in runs[\"workflow_runs\"]:\n            if run[\"id\"\
          ] == run_id:\n                continue\n            if run.get(\"head_branch\"\
          ) != current[\"head_branch\"] or run.get(\"event\") != event:\n        \
          \        continue\n            job_page = 1\n            while True:\n \
          \               jobs = get(\n                    f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={job_page}\"\
          \n                )[\"jobs\"]\n                for job in jobs:\n      \
          \              if (\n                        (\n                       \
          \     is_input_check(job)\n                            if job_name in INPUT_CHECK_NAMES\n\
          \                            else job[\"name\"] == job_name\n          \
          \              )\n                        and job.get(\"status\") == \"\
          completed\"\n                        and job.get(\"conclusion\") == \"success\"\
          \n                        and input_identity(job) == identity\n        \
          \            ):\n                        return False\n                if
          len(jobs) < 100:\n                    break\n                job_page +=
          1\n        if len(runs[\"workflow_runs\"]) < 100:\n            return True\n\
          \        page += 1\n\n\ndef main():\n    event = os.environ[\"AB_EVENT\"\
          ]\n    event_payload = None\n    if event not in {\"schedule\", \"workflow_run\"\
          }:\n        with open(os.environ[\"GITHUB_EVENT_PATH\"], encoding=\"utf-8\"\
          ) as payload_file:\n            event_payload = json.load(payload_file)\n\
          \    inputs = {\n        \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n\
          \        \"source_ref\": os.environ[\"AB_REF\"],\n        \"workflow_definition\"\
          : os.environ[\"AB_WORKFLOW_DIGEST\"],\n        \"event\": event,\n     \
          \   \"event_payload\": event_payload,\n        \"schedule\": os.environ[\"\
          AB_SCHEDULE\"],\n        \"variables\": json.loads(os.environ[\"AB_VARIABLES\"\
          ]),\n        \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n      \
          \  \"runner_image\": [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"\
          ImageVersion\", \"\")],\n        \"producer\": json.loads(os.environ.get(\"\
          AB_WORKFLOW_RUN\", \"null\")),\n    }\n    identity = hashlib.sha256(json.dumps(inputs,
          sort_keys=True).encode()).hexdigest()\n\n    def get(path):\n        request
          = urllib.request.Request(\n            \"https://api.github.com\" + path,\n\
          \            headers={\n                \"Authorization\": \"Bearer \" +
          os.environ[\"GH_TOKEN\"],\n                \"Accept\": \"application/vnd.github+json\"\
          ,\n                \"X-GitHub-Api-Version\": \"2026-03-10\",\n         \
          \   },\n        )\n        with urllib.request.urlopen(request, timeout=60)
          as response:\n            return json.load(response)\n\n    manual = event
          == \"workflow_dispatch\" or int(os.environ[\"GITHUB_RUN_ATTEMPT\"]) > 1\n\
          \    should_run = manual or (\n        (\n            inputs[\"event\"]
          != \"workflow_run\"\n            or parent_has_work(get, os.environ[\"AB_REPOSITORY\"\
          ], inputs[\"producer\"])\n        )\n        and changed(\n            get,\n\
          \            repository=os.environ[\"AB_REPOSITORY\"],\n            run_id=int(os.environ[\"\
          AB_RUN_ID\"]),\n            identity=identity,\n            job_name=\"\
          CI input check\",\n        )\n    )\n    with open(os.environ[\"GITHUB_OUTPUT\"\
          ], \"a\", encoding=\"utf-8\") as output:\n        output.write(f\"digest={identity}\\\
          nchanged={str(should_run).lower()}\\n\")\n    print(\n        \"Explicit
          CI run requested\"\n        if manual\n        else \"CI inputs changed\"\
          \n        if should_run\n        else \"CI inputs unchanged; build and test
          jobs skipped\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n\n\
          ALPHA_BRIDGE_CI_PY\n"
      - name: CI input identity ${{ steps.identity.outputs.digest }}
        run: echo 'Input identity recorded'
